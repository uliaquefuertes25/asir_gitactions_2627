name: Github Action para ejercicio 11
on:
  push:
    branches: [ main ]
jobs:
  ejecutar_script:
    runs-on: ubuntu-26.04
    steps:
    - name: descargar repositorio
      uses: actions/checkout@v5
      
    - name: muestra usuario
      run: 
        whoami
 
    - name: permisos script
      run: |
        chmod +x src/script.sh
        ls -l /src/script.sh
        
    - name: ejecuta script
      run:
        ./src/script.sh